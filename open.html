<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ଗଣିତ ବିଜ୍ଞ</title>
    
    <!-- =================== NEW: OPEN GRAPH TAGS FOR RICH PREVIEWS =================== -->
    <!-- These tags will be read by WhatsApp, Facebook, etc. to create the link preview -->
    <meta property="og:title" content="ଗଣିତ ବିଜ୍ଞ (Ganita Bingya)">
    <meta property="og:description" content="An educational app to learn mathematics in Odia, Hindi, English and many more Indian languages.">
    <meta property="og:image" content="https://raw.githubusercontent.com/imsbg/Ganita-Bingya-App/master/images/logo.png">
    <meta property="og:url" content="https://ganitabingya.netlify.app/open">
    <meta property="og:type" content="website">
    <!-- ============================================================================== -->

    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/imsbg/Ganita-Bingya-App/master/images/logo.png">
    <link rel="shortcut icon" type="image/png" href="https://raw.githubusercontent.com/imsbg/Ganita-Bingya-App/master/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; color: #374151; text-align: center; padding: 50px 20px; }
        .container { max-width: 600px; margin: auto; }
        .loader { border: 4px solid #e5e7eb; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        a { color: #4f46e5; text-decoration: none; font-weight: bold; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://raw.githubusercontent.com/imsbg/Ganita-Bingya-App/master/images/logo.png" alt="Ganita Bigyan Logo" width="100">
        <!-- The h1 tag will now be updated dynamically by the script -->
        <h1 id="title-heading">ଗଣିତ ବିଜ୍ଞ</h1>
        <p id="status-message">ଆପ୍ ଖୋଲିବାକୁ ଚେଷ୍ଟା କରାଯାଉଛି...</p>
        <div class="loader"></div>
        <p>ଯଦି ଆପ୍ ଖୋଲୁନାହିଁ, ଆପଣଙ୍କ ଡାଉନଲୋଡ୍ ଖୁବ୍ ଶୀଘ୍ର ଆରମ୍ଭ ହୋଇଯିବ</p>
        <p>
            ଯଦି ରିଡାଇରେକ୍ଟ କାମ କରୁନାହିଁ, 
            <a id="download-link" href="#">ଆପ୍ ଡାଉନଲୋଡ୍ କରିବା ପାଇଁ ଦୟାକରି ଏଠାରେ କ୍ଲିକ୍ କରନ୍ତୁ</a>.
        </p>
    </div>

    <script>
        // --- CONFIGURATION ---
        const GITHUB_API_URL = "https://api.github.com/repos/imsbg/Ganita-Bingya-App/releases/latest";
        const APK_FILE_NAME = "app-release.apk";
        const REDIRECT_DELAY = 1500; // 1.5 seconds

        // --- NEW: FUNCTION TO UPDATE PAGE CONTENT FOR HUMAN VISITORS ---
        function updatePageContent() {
            const urlParams = new URLSearchParams(window.location.search);
            const titleHeading = document.getElementById('title-heading');
            const statusMessage = document.getElementById('status-message');

            if (urlParams.has('play')) {
                titleHeading.textContent = "Start Game";
                statusMessage.textContent = "Opening the game screen...";
            } else if (urlParams.has('calculator')) {
                titleHeading.textContent = "Calculator";
                statusMessage.textContent = "Opening the calculator...";
            } else if (urlParams.has('numbers')) {
                titleHeading.textContent = "Numbers (1-100)";
                statusMessage.textContent = "Opening the numbers screen...";
            } else if (urlParams.has('ap')) {
                titleHeading.textContent = "Drawing Pad";
                statusMessage.textContent = "Opening the drawing pad...";
            } else if (urlParams.has('panikia')) {
                const tableNumber = urlParams.get('panikia');
                // Check if a specific table number was provided
                if (tableNumber) {
                    titleHeading.textContent = `Multiplication Table of ${tableNumber}`;
                    statusMessage.textContent = `Opening the table of ${tableNumber}...`;
                } else {
                    titleHeading.textContent = "Multiplication Tables";
                    statusMessage.textContent = "Opening the list of tables...";
                }
            }
        }

        async function fetchAndDownload() {
            const statusMessage = document.getElementById('status-message');
            const downloadLink = document.getElementById('download-link');
            const loader = document.querySelector('.loader');

            statusMessage.textContent = 'App not found. Finding the latest version for you...';
            
            try {
                const response = await fetch(GITHUB_API_URL);
                if (!response.ok) throw new Error(`GitHub API Error: ${response.status}`);
                
                const data = await response.json();
                const apkAsset = data.assets.find(asset => asset.name === APK_FILE_NAME);

                if (apkAsset) {
                    const downloadUrl = apkAsset.browser_download_url;
                    downloadLink.href = downloadUrl;
                    statusMessage.textContent = "Redirecting to download...";
                    window.location.replace(downloadUrl);
                } else {
                    throw new Error(`'${APK_FILE_NAME}' not found in the latest release.`);
                }
            } catch (error) {
                console.error("Download failed:", error);
                statusMessage.textContent = 'Could not find the download link. Please check the GitHub repository.';
                loader.style.display = 'none';
            }
        }

        // --- MAIN LOGIC ---

        // NEW: Run the function to update the on-page text immediately
        updatePageContent();

        const fallbackTimer = setTimeout(fetchAndDownload, REDIRECT_DELAY);

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                clearTimeout(fallbackTimer);
            }
        });
    </script>

</body>
</html>
