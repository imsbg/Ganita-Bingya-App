<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Metatags -->
    <title>ଗଣନା ପ୍ରଣାଳୀ - Odia Counting System | ଗଣିତ ବିଜ୍ଞ</title>
    <meta name="description" content="Learn the Odia counting system (Ganana Pranali) for large numbers. From Ek (1) to Pararddha (10^17). ଓଡ଼ିଆ ଗଣନା ପ୍ରଣାଳୀ - ଏକ ରୁ ପରାର୍ଦ୍ଧ।">
    <meta name="keywords" content="odia counting system, ganana pranali, odia large numbers, laksha, koti, arbuda, kharba, padma, odia math, indian number system">
    <meta name="author" content="Ganita Bingya">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="ଗଣନା ପ୍ରଣାଳୀ - Odia Counting System">
    <meta property="og:description" content="List of Odia names for large numbers (Powers of 10).">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        :root {
            --text-dark: #222;
            --header-bg: #333333;
            --header-text: #ffffff;
            --border-color: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans Oriya', sans-serif;
            background-color: #f9f9f9;
            color: var(--text-dark);
            min-height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            border-left: 1px solid #eee;
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background-color: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            color: #000;
        }

        .material-icons-round {
            font-size: 28px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #000;
        }

        /* Table Header Strip */
        .table-head {
            background-color: var(--header-bg);
            color: var(--header-text);
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            font-weight: 700;
            font-size: 18px;
            position: sticky;
            top: 60px; /* Below the main header */
            z-index: 90;
        }

        /* List Items */
        .list-container {
            background-color: #fff;
            flex-grow: 1;
            padding-bottom: 40px;
        }

        .list-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 18px;
        }

        .list-row:hover {
            background-color: #f0f0f0;
        }

        .col-num {
            font-weight: 700;
            text-align: left;
            /* Handle very long numbers wrapping */
            word-break: break-all;
            padding-right: 20px;
            color: #333;
            letter-spacing: 1px;
        }

        .col-name {
            font-weight: 700;
            text-align: right;
            white-space: nowrap; /* Keep names on one line */
            min-width: 80px;
        }

    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <button class="back-btn" onclick="goBack()" aria-label="Go Back">
            <span class="material-icons-round">arrow_back</span>
        </button>
        <h1>ଗଣନା ପ୍ରଣାଳୀ</h1>
    </header>

    <!-- Column Headers -->
    <div class="table-head">
        <span>ସଂଖ୍ୟା</span>
        <span>ନାମ</span>
    </div>

    <!-- List Container -->
    <div class="list-container" id="listContainer">
        <!-- JavaScript will populate this -->
    </div>

    <script>
        // Data arrays from XML
        const ganana_numbers = [
            "୧",
            "୧୦",
            "୧୦୦",
            "୧୦୦୦",
            "୧୦୦୦୦",
            "୧୦୦୦୦୦",
            "୧୦୦୦୦୦୦",
            "୧୦୦୦୦୦୦୦",
            "୧୦୦୦୦୦୦୦୦",
            "୧୦୦୦୦୦୦୦୦୦",
            "୧୦୦୦୦୦୦୦୦୦୦",
            "୧୦୦୦୦୦୦୦୦୦୦୦",
            "୧୦୦୦୦୦୦୦୦୦୦୦୦",
            "୧୦୦୦୦୦୦୦୦୦୦୦୦୦",
            "୧୦୦୦୦୦୦୦୦୦୦୦୦୦୦",
            "୧୦୦୦୦୦୦୦୦୦୦୦୦୦୦୦",
            "୧୦୦୦୦୦୦୦୦୦୦୦୦୦୦୦୦",
            "୧୦୦୦୦୦୦୦୦୦୦୦୦୦୦୦୦୦"
        ];

        const ganana_names = [
            "ଏକ",
            "ଦଶ",
            "ଶହ",
            "ହଜାର",
            "ଅୟୁତ",
            "ଲକ୍ଷ",
            "ନିୟୁତ",
            "କୋଟି",
            "ଅର୍ବୁଦ",
            "ବୃନ୍ଦ",
            "ଖର୍ବ",
            "ନିଖର୍ବ",
            "ଶଙ୍ଖ",
            "ପଦ୍ମ",
            "ସାଗର",
            "ଅନ୍ତ୍ୟ",
            "ମଧ୍ୟ",
            "ପରାର୍ଦ୍ଧ"
        ];

        function renderList() {
            const container = document.getElementById('listContainer');
            let html = '';

            for (let i = 0; i < ganana_numbers.length; i++) {
                html += `
                    <div class="list-row">
                        <div class="col-num">${ganana_numbers[i]}</div>
                        <div class="col-name">${ganana_names[i]}</div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function goBack() {
            if (document.referrer) {
                history.back();
            } else {
                window.location.href = "index.html";
            }
        }

        // Initialize
        window.onload = renderList;
    </script>
</body>
</html>
